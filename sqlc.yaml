version: "2"
sql:
  - engine: postgresql
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "qg"
        out: "internal/db/qg"
        emit_interface: true
        emit_json_tags: true
        query_parameter_limit: 0
        sql_package: "pgx/v5"
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "json"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
